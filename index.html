<title>Mr. Mars Music Studio All in 1 M.D.26/ V.08.11. Touch</title>
<meta name="author" content="MRH DGN">
<meta name="application-name" content="Mr. Mars Music Studio">
<meta name="description" content="A full music studio in your browser: arranger, 4-deck DJ mixer, amp rack, Turkish maqams and instant QR transfer to your phone. No install, no account, no cost.">
<meta property="og:type" content="website">
<meta property="og:title" content="Mr. Mars Music Studio All in 1">
<meta property="og:description" content="A full music studio in your browser. No install, no account, no cost.">
<meta property="og:url" content="https://merihdogan.github.io/Mr.Mars.Music.Studio-All-in-1-Touch/">
<meta property="og:image" content="https://merihdogan.github.io/Mr.Mars.Music.Studio-All-in-1-Touch/mrmars-gorseller/tanitim-kart.png">

<link rel="icon" type="image/png" sizes="32x32" href="mrmars-gorseller/icon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="mrmars-gorseller/icon-256.png">
<link rel="stylesheet" href="dgn-tema/app.css">
</head>
<body>
<div id="splash"><div class="splash-card"><img src="mrmars-gorseller/logo-512.png" alt="Mr. Mars Music Studio All in 1"><div class="splash-ver">M.D.26/ V.08.11. Touch</div><div class="splash-bar"><div></div></div><div class="splash-msg"></div></div></div>
<div id="app">
  <header id="topbar">
    <div class="brand" title="Mr. Mars Music Studio All in 1"><img class="brand-logo" src="mrmars-gorseller/icon-64.png" alt=""><span>Mr. Mars</span> <span class="brand-sub">Music Studio All in 1</span><span class="version-tag">M.D.26/ V.08.11. Touch</span></div>
    <div class="menu-row">
      <button class="btn ghost" data-menu="file">Dosya</button>
      <button class="btn ghost" data-menu="edit">Düzen</button>
      <button class="btn ghost" data-menu="track">Parça</button>
      <button class="btn ghost" data-menu="tools">Araçlar</button>
      <button class="btn ghost lang-btn" data-menu="lang" title="Dil / Language"></button>
      <button class="btn ghost" id="manual-btn" title="Kullanım kılavuzu (İngilizce)">❓ Kılavuz</button>
      <button class="btn ghost" id="phone-btn" title="Müziği QR kodla telefona gönder">📱 Telefona Gönder</button>
    </div>
    <div class="transport">
      <button class="tbtn" id="t-start" title="Başa dön (Home)">⏮</button>
      <button class="tbtn" id="t-stop" title="Durdur">■</button>
      <button class="tbtn" id="t-play" title="Çal / Duraklat (Boşluk)">▶</button>
      <button class="tbtn rec" id="t-rec" title="Kayıt (R)">●</button>
      <button class="tbtn tog" id="t-loop" title="Döngü (L)">⟲</button>
      <button class="tbtn tog" id="t-metro" title="Metronom (M)">♩</button>
      <div class="lcd"><div id="lcd-bars">1.1.1</div><div id="lcd-time">00:00.000</div></div>
      <label class="field">BPM <input id="t-bpm" type="number" min="20" max="300" step="0.1"></label>
      <label class="field">Ölçü <input id="t-sig" type="text" size="3"></label>
      <button class="tbtn" id="t-tap" title="Tempo tıkla">TAP</button>
    </div>
    <nav id="tabs">
      <button data-view="arrange" class="active">Aranjman</button>
      <button data-view="session">Session</button>
      <button data-view="rack">Desen Rafı</button>
      <button data-view="mixer">Mikser</button>
      <button data-view="mini">Mini Araçlar</button>
      <button data-view="reinst">Yeniden Çal</button>
      <button data-view="rig">Amfi Rack</button>
      <button data-view="dj">DJ Mikser</button>
      <button data-view="world">Doğu·Batı·Afro</button>
      <button data-view="metal">Metal Creative</button>
      <button data-view="plugins">Eklentiler</button>
    </nav>
    <div class="master-meter"><canvas id="master-meter" width="120" height="14"></canvas></div>
    <button id="about-btn" title="Hakkında"><img src="mrmars-gorseller/icon-32.png" alt=""><span>Hakkında</span></button>
  </header>

  <main id="views">
    <section id="view-arrange" class="view active">
      <div id="arr-toolbar" class="toolbar"></div>
      <div id="arr-body">
        <div id="arr-headers"></div>
        <div id="arr-scroll">
          <div id="arr-ruler"></div>
          <div id="arr-lanes"></div>
          <div id="arr-playhead"></div>
        </div>
      </div>
      <div id="lower-zone" class="hidden">
        <div class="lz-bar"><span id="lz-title"></span><span class="spacer"></span><button class="btn sm" id="lz-close">✕</button></div>
        <div id="lz-content"></div>
      </div>
    </section>
    <section id="view-session" class="view"></section>
    <section id="view-rack" class="view"></section>
    <section id="view-mixer" class="view"></section>
    <section id="view-mini" class="view"></section>
    <section id="view-reinst" class="view"></section>
    <section id="view-rig" class="view"></section>
    <section id="view-dj" class="view"></section>
    <section id="view-world" class="view"></section>
    <section id="view-metal" class="view"></section>
    <section id="view-plugins" class="view"></section>
  </main>

  <aside id="inspector"></aside>
  <footer id="keyboard-bar"></footer>
</div>
